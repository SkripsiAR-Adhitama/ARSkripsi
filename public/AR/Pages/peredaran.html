<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Simple AR Hit Test</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body style="margin:0">

<a-scene
  renderer="colorManagement: true;"
  xr-mode-ui="enabled: true"
  webxr="requiredFeatures: hit-test, local-floor"
>

  <a-camera></a-camera>

  <a-box
    id="box"
    color="red"
    scale="0.2 0.2 0.2"
    >
  </a-box>

</a-scene>

<script>
AFRAME.registerComponent('ar-hit-test', {
  init: function () {
    const sceneEl = this.el;
    const box = document.querySelector('#box');

    sceneEl.addEventListener('enter-vr', async () => {

      const session = sceneEl.renderer.xr.getSession();
      const referenceSpace = await session.requestReferenceSpace('viewer');
      const hitTestSource = await session.requestHitTestSource({
        space: referenceSpace
      });

      const localSpace = await session.requestReferenceSpace('local-floor');

      session.requestAnimationFrame(function onXRFrame(time, frame) {

        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          const pose = hitTestResults[0].getPose(localSpace);

          box.object3D.position.set(
            pose.transform.position.x,
            pose.transform.position.y,
            pose.transform.position.z
          );

          box.setAttribute('visible', true);
        }

        session.requestAnimationFrame(onXRFrame);
      });

    });
  }
});

document.querySelector('a-scene').addEventListener('loaded', function () {
  this.setAttribute('ar-hit-test', '');
});
</script>

</body>
</html>
