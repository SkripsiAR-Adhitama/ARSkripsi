<html>
  <head>
 <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.min.js"></script>
 <script src="https://cdn.jsdelivr.net/gh/chenzlabs/aframe-ar@master/dist/aframe-ar.min.js"></script>
  </head>
  <body>
    <a-scene ar>
       <a-entity id="jantung-container" position="0 0 -2" visible="false">
      
      <!-- Ground indicator -->
      <a-circle 
        position="0 -0.5 0" 
        rotation="-90 0 0" 
        radius="1" 
        color="#EF4444" 
        opacity="0.3"
      ></a-circle>
      
      <!-- Grup organ jantung -->
      <a-entity id="organ-group" position="0 0.5 0" scale="7 7 7">
        
        <!-- Bilik Tutup -->
        <a-gltf-model 
          id="bilikTutup"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/bilikTutup.glb"
          data-title="Bilik Tutup"
          data-description="Bagian penutup bilik jantung yang melindungi ruang ventrikel. Berperan penting dalam menjaga tekanan darah saat jantung berkontraksi."
        ></a-gltf-model>
       
        <!-- Vena Kecil -->
        <a-gltf-model 
          id="venaKecil"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/vena_kecil.glb"
          data-title="Vena Kava"
          data-description="Pembuluh darah vena besar yang membawa darah miskin oksigen dari seluruh tubuh kembali ke jantung, masuk ke serambi kanan."
        ></a-gltf-model>
       
        <!-- Serambi Kiri -->
        <a-gltf-model 
          id="serambiKiri"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/serambiKiri.glb"
          data-title="Serambi Kiri (Atrium Kiri)"
          data-description="Ruang atas kiri jantung yang menerima darah kaya oksigen dari paru-paru melalui vena pulmonalis, kemudian memompanya ke bilik kiri."
        ></a-gltf-model>

        <!-- Vena Pulmonalis -->
        <a-gltf-model 
          id="venaPulmonalis"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/vena_pulmonalis.glb"
          data-title="Vena Pulmonalis"
          data-description="Pembuluh darah yang membawa darah kaya oksigen dari paru-paru ke serambi kiri jantung. Merupakan satu-satunya vena yang membawa darah bersih."
        ></a-gltf-model>

        <!-- Katup Bikuspid -->
        <a-gltf-model 
          id="katupBikuspid"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/katup_bikuspid.glb"
          data-title="Katup Bikuspid (Mitral)"
          data-description="Katup dengan dua daun yang terletak antara serambi kiri dan bilik kiri. Mencegah aliran balik darah dari bilik ke serambi."
        ></a-gltf-model>

        <!-- Aorta -->
        <a-gltf-model 
          id="aorta"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/aorta.glb"
          data-title="Aorta"
          data-description="Pembuluh arteri terbesar dalam tubuh yang membawa darah kaya oksigen dari bilik kiri ke seluruh tubuh melalui sistem peredaran darah besar."
        ></a-gltf-model>

        <!-- Bilik Kiri -->
        <a-gltf-model 
          id="bilikKiri"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/bilikKiri.glb"
          data-title="Bilik Kiri (Ventrikel Kiri)"
          data-description="Ruang bawah kiri jantung yang memompa darah kaya oksigen ke seluruh tubuh melalui aorta. Memiliki dinding paling tebal karena harus memompa dengan tekanan tinggi."
        ></a-gltf-model>

        <!-- Arteri Pulmonalis -->
        <a-gltf-model 
          id="arteriPulmonalis"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/arteri_pulmonalis.glb"
          data-title="Arteri Pulmonalis"
          data-description="Pembuluh arteri yang membawa darah miskin oksigen dari bilik kanan ke paru-paru untuk dibersihkan. Merupakan satu-satunya arteri yang membawa darah kotor."
        ></a-gltf-model>

        <!-- Aurikel Kiri -->
        <a-gltf-model 
          id="aurikelKiri"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/aurikel_kiri.glb"
          data-title="Aurikel Kiri"
          data-description="Kantung berbentuk telinga pada serambi kiri jantung yang berfungsi sebagai reservoir tambahan untuk menampung darah."
        ></a-gltf-model>

        <!-- Bilik Kanan Dalam -->
        <a-gltf-model 
          id="bilikKananDalam"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/bilikKananDalam.glb"
          data-title="Bilik Kanan Dalam (Ventrikel Kanan)"
          data-description="Bagian dalam bilik kanan yang memompa darah miskin oksigen ke paru-paru melalui arteri pulmonalis untuk proses oksigenasi."
        ></a-gltf-model>

        <!-- Serambi Kanan -->
        <a-gltf-model 
          id="serambiKanan"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/serambiKanan.glb"
          data-title="Serambi Kanan (Atrium Kanan)"
          data-description="Ruang atas kanan jantung yang menerima darah miskin oksigen dari seluruh tubuh melalui vena kava, kemudian memompanya ke bilik kanan."
        ></a-gltf-model>

        <!-- Aurikel Kanan -->
        <a-gltf-model 
          id="aurikel_kanan"
          class="organ-part clickable"
          src="/AR/Models/Peredaran/aurikel_kanan.glb"
          data-title="Aurikel Kanan"
          data-description="Kantung berbentuk telinga pada serambi kanan jantung yang membantu menampung darah yang masuk dari vena kava sebelum dipompa ke bilik kanan."
        ></a-gltf-model>

      </a-entity>
    </a-entity>
    <a-scene>  
  </body>
</html>
