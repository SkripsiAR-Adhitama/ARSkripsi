<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }

    #overlay {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 15px;
    }

    #controls {
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:10px;
    }

    #infoBox {
      background:white;
      color:black;
      padding:10px;
      border-radius:10px;
      max-height:120px;
      overflow:auto;
    }

    #rings {
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .ring {
      width:30px;
      height:30px;
      border-radius:50%;
      border:2px solid white;
      text-align:center;
      line-height:26px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<a-scene
  embedded
  xr-mode-ui="enabled: true"
  webxr="requiredFeatures: hit-test, local-floor"
  one-time-hit-test
>

  <!-- Anchor untuk menjaga posisi -->
  <a-entity id="placementAnchor">

    <a-gltf-model 
      id="bilikTutup"
      src="../Models/Peredaran/bilikTutup.glb"
      scale="3 3 3"
      visible="false"
      data-title="Bilik Tutup"
      data-description="Bagian penutup bilik jantung.">
    </a-gltf-model>

    <a-gltf-model 
      id="serambiKiri"
      src="../Models/Peredaran/serambiKiri.glb"
      scale="3 3 3"
      visible="false"
      data-title="Serambi Kiri"
      data-description="Menerima darah kaya oksigen dari paru-paru.">
    </a-gltf-model>

  </a-entity>

</a-scene>


<!-- ================= DOM OVERLAY ================= -->
<div id="overlay">

  <div id="controls">
    Rotasi (360° Horizontal):
    <input type="range" min="0" max="360" value="0" id="rotateSlider">

    Scale (1–5):
    <input type="range" min="1" max="5" value="3" id="scaleSlider">
  </div>

  <div id="infoBox">
    Tap permukaan untuk menempatkan objek, lalu pilih bagian.
  </div>

  <div id="rings">
    <div class="ring" data-target="bilikTutup">1</div>
    <div class="ring" data-target="serambiKiri">2</div>
  </div>

</div>


<script>

// ================= HIT TEST SEKALI =================
AFRAME.registerComponent('one-time-hit-test', {
  init: function () {
    this.placed = false;
    this.hitTestSource = null;
    this.referenceSpace = null;
    this.viewerSpace = null;
    this.anchor = document.querySelector('#placementAnchor');
  },

  async enterVR () {
    const sceneEl = this.el;
    const session = sceneEl.renderer.xr.getSession();

    this.viewerSpace = await session.requestReferenceSpace('viewer');
    this.referenceSpace = await session.requestReferenceSpace('local-floor');

    this.hitTestSource = await session.requestHitTestSource({
      space: this.viewerSpace
    });

    session.addEventListener('select', () => {
      this.placeObject();
    });
  },

  tick: function () {
    if (!this.hitTestSource || this.placed) return;

    const frame = this.el.renderer.xr.getFrame();
    if (!frame) return;

    const hitTestResults = frame.getHitTestResults(this.hitTestSource);

    if (hitTestResults.length > 0) {
      this.latestHit = hitTestResults[0];
    }
  },

  placeObject: function () {
    if (this.placed || !this.latestHit) return;

    const pose = this.latestHit.getPose(this.referenceSpace);

    this.anchor.object3D.position.set(
      pose.transform.position.x,
      pose.transform.position.y,
      pose.transform.position.z
    );

    this.placed = true;

    if (this.hitTestSource) {
      this.hitTestSource.cancel();
      this.hitTestSource = null;
    }

    document.getElementById("infoBox").innerHTML =
      "Objek berhasil ditempatkan. Pilih bagian untuk melihat informasi.";
  }
});


// ================= INTERAKSI =================
let currentObject = null;

document.querySelectorAll('.ring').forEach(ring => {
  ring.addEventListener('click', () => {

    const targetId = ring.dataset.target;
    const object = document.querySelector('#' + targetId);

    if (!object) return;

    document.querySelectorAll('a-gltf-model').forEach(m => {
      m.setAttribute('visible', false);
    });

    object.setAttribute('visible', true);
    currentObject = object;

    document.getElementById('infoBox').innerHTML =
      "<b>" + object.dataset.title + "</b><br>" +
      object.dataset.description;
  });
});


// ================= ROTASI HORIZONTAL =================
document.getElementById('rotateSlider').addEventListener('input', (e) => {
  if (!currentObject) return;

  currentObject.setAttribute('rotation', {
    x: 0,
    y: e.target.value,
    z: 0
  });
});


// ================= SCALE 1–5 =================
document.getElementById('scaleSlider').addEventListener('input', (e) => {
  if (!currentObject) return;

  const s = e.target.value;

  currentObject.setAttribute('scale', {
    x: s,
    y: s,
    z: s
  });
});

</script>

</body>
</html>
